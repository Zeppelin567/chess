<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess ♞ 双人对弈</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #161512; color: #bababa; margin: 0; padding: 24px;
         display: flex; flex-direction: column; align-items: center; }
  h1 { color: #fff; font-size: 22px; margin: 0 0 16px; }
  h1 small { color: #888; font-weight: normal; font-size: 14px; }
  #app { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
         justify-content: center; }
  #board { display: grid; grid-template-columns: repeat(8, 64px);
           grid-template-rows: repeat(8, 64px); border-radius: 6px;
           overflow: hidden; user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center;
        font-size: 44px; cursor: pointer; position: relative; }
  .light { background: #f0d9b5; }
  .dark { background: #b58863; }
  .sq.selected { outline: 3px solid #829769; outline-offset: -3px; }
  .sq.lastmove { background: #cdd26a; }
  .sq.lastmove.dark { background: #aaa23a; }
  /* 合法走位的圆点提示 */
  .sq.hint::after { content: ""; width: 20px; height: 20px; border-radius: 50%;
                    background: rgba(20, 85, 30, 0.35); position: absolute; }
  .sq.hint.capture::after { width: 56px; height: 56px; background: transparent;
                    border: 5px solid rgba(20, 85, 30, 0.35); }
  .piece.w { color: #fff; text-shadow: 0 0 3px #000, 0 2px 2px #000; }
  .piece.b { color: #000; text-shadow: 0 0 3px #fff, 0 1px 1px #555; }
  #side { width: 260px; display: flex; flex-direction: column; gap: 12px; }
  #status { background: #262421; border-radius: 6px; padding: 12px;
            font-size: 15px; color: #fff; min-height: 20px; }
  #captured { font-size: 26px; min-height: 32px; line-height: 1.2; }
  #captured .score { font-size: 14px; color: #888; margin-left: 8px; }
  #moves { background: #262421; border-radius: 6px; padding: 12px 12px 12px 32px;
           margin: 0; height: 220px; overflow-y: auto; font-size: 14px; }
  #moves li { margin-bottom: 2px; }
  button { background: #629924; color: #fff; border: none; border-radius: 6px;
           padding: 10px; font-size: 15px; cursor: pointer; }
  button:hover { background: #7cb342; }
  .note { font-size: 12px; color: #666; max-width: 560px; text-align: center;
          margin-top: 16px; }
</style>
</head>
<body>
<h1>♞ 国际象棋 <small>双人对弈</small></h1>
<div id="app">
  <div id="board"></div>
  <div id="side">
    <div id="status">白方行棋</div>
    <div id="captured"></div>
    <ol id="moves"></ol>
    <button id="newGame">新开一局</button>
  </div>
</div>
<p class="note">点击棋子选中（绿点为合法走位），再点目标格走棋。升变自动升后。<br>
规则引擎：chess.js（将军 / 将杀 / 逼和 / 长捉和棋等自动判定）</p>

<!-- chess.js 提供完整的规则判定：合法走位、将军、将杀、逼和、王车易位、吃过路兵 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script>
const game = new Chess();   // 棋局状态全部由 chess.js 维护
let selected = null;        // 当前选中的格子，如 "e2"

const GLYPH = {
  w: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" },
  b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" },
};
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9 };   // 子力价值，用于统计吃子

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const movesEl = document.getElementById("moves");
const capturedEl = document.getElementById("captured");

// 行列序号 <-> 格子名（"e4"）的换算。白方在下：row 0 = 第 8 横线
function sqName(row, col) {
  return "abcdefgh"[col] + (8 - row);
}

function render() {
  const position = game.board();          // 8x8 数组，row 0 = 8th rank
  const last = game.history({ verbose: true }).slice(-1)[0];
  const hints = selected
    ? game.moves({ square: selected, verbose: true })
    : [];

  boardEl.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = sqName(r, c);
      const piece = position[r][c];
      const div = document.createElement("div");
      div.className = "sq " + ((r + c) % 2 === 0 ? "light" : "dark");
      div.dataset.square = sq;
      if (piece) {
        const span = document.createElement("span");
        span.className = "piece " + piece.color;
        span.textContent = GLYPH[piece.color][piece.type];
        div.appendChild(span);
      }
      if (sq === selected) div.classList.add("selected");
      if (last && (sq === last.from || sq === last.to)) div.classList.add("lastmove");
      const hint = hints.find((m) => m.to === sq);
      if (hint) div.classList.add("hint", hint.captured ? "capture" : "");
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
  renderStatus();
  renderMoves();
  renderCaptured();
}

function onSquareClick(e) {
  const sq = e.currentTarget.dataset.square;
  // 情况 1：已经选中了棋子，这次点的是合法目标 -> 走棋
  if (selected) {
    const move = game.moves({ square: selected, verbose: true })
      .find((m) => m.to === sq);
    if (move) {
      game.move({ from: selected, to: sq, promotion: "q" });  // 升变默认升后
      selected = null;
      render();
      return;
    }
  }
  // 情况 2：点的是己方棋子 -> 选中（或换选）；其他 -> 取消选中
  const piece = game.get(sq);
  selected = piece && piece.color === game.turn() ? sq : null;
  render();
}

function renderStatus() {
  let text;
  if (game.in_checkmate()) {
    const winner = game.turn() === "w" ? "黑方" : "白方";
    text = "将杀！🎉 " + winner + " 获胜";
  } else if (game.in_stalemate()) {
    text = "逼和 🤝 双方和棋";
  } else if (game.in_draw()) {
    text = "和棋 🤝（三次重复局面 / 50 回合 / 子力不足）";
  } else {
    text = (game.turn() === "w" ? "白方" : "黑方") + "行棋";
    if (game.in_check()) text += " — 将军！";
  }
  statusEl.textContent = text;
}

function renderMoves() {
  const history = game.history();   // ["e4", "e5", "Nf3", ...]
  movesEl.innerHTML = "";
  for (let i = 0; i < history.length; i += 2) {
    const li = document.createElement("li");
    li.textContent = history[i] + (history[i + 1] ? "  " + history[i + 1] : "");
    movesEl.appendChild(li);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

function renderCaptured() {
  // 统计被吃掉的子：初始子力 - 棋盘上剩余
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const onBoard = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 },
                    b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
  for (const row of game.board())
    for (const piece of row)
      if (piece && piece.type !== "k") onBoard[piece.color][piece.type]++;

  let html = "";
  let scoreW = 0, scoreB = 0;
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.b[type]; i++) {  // 白方吃掉的黑子
      html += '<span class="piece b">' + GLYPH.b[type] + "</span>";
      scoreW += VALUE[type];
    }
  }
  html += " ";
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.w[type]; i++) {  // 黑方吃掉的白子
      html += '<span class="piece w">' + GLYPH.w[type] + "</span>";
      scoreB += VALUE[type];
    }
  }
  const diff = scoreW - scoreB;
  if (diff !== 0)
    html += '<span class="score">' + (diff > 0 ? "白方 +" : "黑方 +")
      + Math.abs(diff) + "</span>";
  capturedEl.innerHTML = html;
}

document.getElementById("newGame").addEventListener("click", () => {
  game.reset();
  selected = null;
  render();
});

render();
</script>
</body>
</html>
