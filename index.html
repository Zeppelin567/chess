<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess ♞ Two-Player Game</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #161512; color: #bababa; margin: 0; padding: 24px;
         display: flex; flex-direction: column; align-items: center; }
  h1 { color: #fff; font-size: 22px; margin: 0 0 16px; }
  h1 small { color: #888; font-weight: normal; font-size: 14px; }
  #app { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
         justify-content: center; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr);
           grid-template-rows: repeat(8, 1fr); aspect-ratio: 1 / 1;
           --board-size: min(100vw - 48px, 512px); /* minus body side padding */
           width: var(--board-size); border-radius: 6px;
           overflow: hidden; user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center;
        font-size: calc(var(--board-size) / 8 * 0.7);
        cursor: pointer; position: relative; }
  .light { background: #f0d9b5; }
  .dark { background: #b58863; }
  .sq.selected { outline: 3px solid #829769; outline-offset: -3px; }
  .sq.lastmove { background: #cdd26a; }
  .sq.lastmove.dark { background: #aaa23a; }
  /* dots marking legal moves */
  .sq.hint::after { content: ""; width: 31%; aspect-ratio: 1 / 1; border-radius: 50%;
                    background: rgba(20, 85, 30, 0.35); position: absolute; }
  .sq.hint.capture::after { width: 88%; background: transparent;
                    border: calc(var(--board-size) / 8 * 0.09) solid rgba(20, 85, 30, 0.35); }
  .piece.w { color: #fff; text-shadow: 0 0 3px #000, 0 2px 2px #000; }
  .piece.b { color: #000; text-shadow: 0 0 3px #fff, 0 1px 1px #555; }
  #side { width: 260px; display: flex; flex-direction: column; gap: 12px; }
  #status { background: #262421; border-radius: 6px; padding: 12px;
            font-size: 15px; color: #fff; min-height: 20px; }
  #captured { font-size: 26px; min-height: 32px; line-height: 1.2; }
  #captured .score { font-size: 14px; color: #888; margin-left: 8px; }
  #moves { background: #262421; border-radius: 6px; padding: 12px 12px 12px 32px;
           margin: 0; height: 180px; overflow-y: auto; font-size: 14px; }
  #moves li { margin-bottom: 2px; }
  button { background: #629924; color: #fff; border: none; border-radius: 6px;
           padding: 10px; font-size: 15px; cursor: pointer; }
  button:hover { background: #7cb342; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
  .hidden { display: none !important; }
  .row { display: flex; gap: 8px; }
  .row button, .row select, .row input { flex: 1; }
  select, input { background: #262421; color: #fff; border: 1px solid #444;
           border-radius: 6px; padding: 10px; font-size: 14px; }
  input::placeholder { color: #777; }
  .note { font-size: 12px; color: #666; max-width: 560px; text-align: center;
          margin-top: 16px; }
  .dim { font-size: 12px; color: #777; }
  /* clocks */
  .clock { background: #262421; border-radius: 6px; padding: 8px 12px;
           font-size: 18px; color: #fff; display: flex; align-items: center;
           gap: 8px; border: 2px solid transparent; }
  .clock.active { border-color: #629924; }
  .clock.low span { color: #ff6b6b; }
  /* online box */
  #onlineBox { background: #262421; border-radius: 6px; padding: 12px;
               display: flex; flex-direction: column; gap: 8px; }
  #onlineBox .online-title { color: #fff; font-size: 14px; }
  /* promotion modal */
  #promoModal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
                display: flex; align-items: center; justify-content: center;
                z-index: 10; }
  .promo-box { background: #262421; border-radius: 10px; padding: 20px 24px;
               text-align: center; }
  .promo-title { color: #fff; margin-bottom: 12px; font-size: 15px; }
  .promo-choices { display: flex; gap: 10px; }
  .promo-btn { font-size: 44px; width: 64px; height: 64px; padding: 0;
               background: #3a382f; }
</style>
</head>
<body>
<h1>♞&#xFE0E; Chess <small>two-player game</small></h1>
<div id="app">
  <div id="board"></div>
  <div id="side">
    <div class="clock" id="clockB">⚫ <span>10:00</span></div>
    <div id="status">White to move</div>
    <div id="captured"></div>
    <ol id="moves"></ol>
    <div class="clock" id="clockW">⚪ <span>10:00</span></div>
    <div class="row">
      <select id="timeControl" title="Time control">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5">5 min</option>
        <option value="10" selected>10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
      <button id="newGame">New game</button>
    </div>
    <button id="flipBoard">Flip board</button>
    <div id="onlineBox">
      <div class="online-title">🌐 Online play</div>
      <div class="row">
        <input id="roomCode" placeholder="Room code" maxlength="24">
        <button id="joinBtn">Join</button>
      </div>
      <div id="onlineStatus" class="dim"></div>
      <button id="leaveBtn" class="hidden">Leave room</button>
    </div>
  </div>
</div>

<div id="promoModal" class="hidden">
  <div class="promo-box">
    <div class="promo-title">Promote pawn to:</div>
    <div class="promo-choices" id="promoChoices"></div>
  </div>
</div>

<p class="note">Click a piece to select it (green dots mark legal moves), then click a target square.<br>
Rules engine: chess.js (check / checkmate / stalemate / draw detection)</p>

<!-- chess.js handles all the rules: legal moves, check, checkmate, stalemate, castling, en passant.
     NOTE: chess.js 0.13.4 ships as an ES module, so it must be imported from a
     type="module" script -- a classic <script src> would throw a SyntaxError
     on the `export` statement and kill the whole game. -->
<!-- Firebase (only needed for online play; harmless if it fails to load) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import { Chess } from "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js";

const game = new Chess();   // chess.js owns all game state
let selected = null;        // currently selected square, e.g. "e2"
let flipped = false;        // flip the board (black at the bottom)
let gameOver = null;        // null or { winner: 'w'|'b'|null, reason, text }
let pendingPromo = null;    // { from, to } while the promotion dialog is open

// ---------- clocks ----------
let clockMs = { w: 10 * 60000, b: 10 * 60000 };
let lastTick = Date.now();
let lastClockPush = 0;        // last clocks persist while opponent away

function resetClocks() {
  const mins = parseInt(timeControl.value, 10) || 10;
  clockMs = { w: mins * 60000, b: mins * 60000 };
  lastTick = Date.now();
}

function clocksLive() {
  if (gameOver) return false;
  return mode === "local" ? game.history().length > 0 : roomStatus === "playing";
}

function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function renderClocks() {
  clockWSpan.textContent = fmtClock(clockMs.w);
  clockBSpan.textContent = fmtClock(clockMs.b);
  const active = clocksLive();
  clockWBox.classList.toggle("active", active && game.turn() === "w");
  clockBBox.classList.toggle("active", active && game.turn() === "b");
  clockWBox.classList.toggle("low", clockMs.w < 20000);
  clockBBox.classList.toggle("low", clockMs.b < 20000);
}

setInterval(() => {
  const now = Date.now();
  const dt = Math.min(now - lastTick, 1000); // clamp: timers throttle when tab is hidden
  lastTick = now;
  if (!clocksLive()) return;
  const t = game.turn();
  // Chess clocks are deterministic: only the side to move ticks down, so
  // each client ticks BOTH clocks locally and the opponent's clock stays
  // live on screen. onRoomUpdate re-syncs any drift on room writes.
  clockMs[t] -= dt;
  // While the opponent is away, persist the clocks every few seconds so the
  // decay survives even if I disconnect too.
  if (mode === "online" && roomRef && !oppOnline && now - lastClockPush > 5000) {
    lastClockPush = now;
    roomRef.update({ clocks: { w: Math.max(0, Math.round(clockMs.w)), b: Math.max(0, Math.round(clockMs.b)) } }).catch(() => {});
  }
  if (clockMs[t] <= 0) {
    clockMs[t] = 0;
    // Each client normally only flags its OWN side — EXCEPT when the opponent
    // has disconnected: then the remaining client declares the flag so a dead
    // opponent can't stall the game. Clocks run for offline players either way.
    const oppGone = mode === "online" && t !== myColor && !oppOnline;
    if (mode === "online" && t !== myColor && !oppGone) { renderClocks(); return; }
    const w = t === "w" ? "b" : "w";
    gameOver = {
      winner: w, reason: "time",
      text: (w === "w" ? "White" : "Black") + " wins on time ⏰",
    };
    if (mode === "online") {
      if (oppGone) declareResult(w);
      else pushMove();
    }
    render();
    return;
  }
  renderClocks();
}, 100);

// ---------- online play (Firebase Realtime Database) ----------
let mode = "local";           // "local" | "online"
let myColor = null;           // 'w' | 'b' when online
let roomRef = null;
let roomCode = "";
let roomStatus = "waiting";   // local mirror of room.status
let oppOnline = false;        // is the opponent currently connected?
let db = null;

function initFirebaseOnce() {
  if (db) return true;
  if (typeof firebase === "undefined" || !FIREBASE_CONFIGURED) return false;
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  return true;
}

function setOnlineStatus(t) {
  onlineStatusEl.textContent = t;
}

function joinUI(online) {
  roomCodeInput.disabled = online;
  joinBtn.disabled = online;
  leaveBtn.classList.toggle("hidden", !online);
  newGameBtn.disabled = online;
  timeControl.disabled = online;
}

function resultCode() {
  if (!gameOver) return null;
  return gameOver.winner === "w" ? "1-0" : gameOver.winner === "b" ? "0-1" : "1/2-1/2";
}

function resultLongText(code) {
  return code === "1-0" ? "White wins 🎉"
       : code === "0-1" ? "Black wins 🎉"
       : "Draw 🤝";
}

// Write my move to the room inside a transaction so two simultaneous
// moves can't corrupt the room: only the side to move may write.
function pushMove() {
  if (mode !== "online" || !roomRef || !myColor) return;
  const fen = game.fen();
  const moves = game.history();
  const clocks = { w: Math.max(0, Math.round(clockMs.w)), b: Math.max(0, Math.round(clockMs.b)) };
  const res = resultCode();
  const turn = game.turn();
  roomRef.transaction(
    (room) => {
      if (!room) return;                 // room deleted -> abort
      if (room.turn !== myColor) return;  // lost the race -> abort
      room.fen = fen;
      room.moves = moves;
      room.turn = turn;
      room.clocks = clocks;
      if (res) { room.status = "finished"; room.result = res; room.finishedAt = firebase.database.ServerValue.TIMESTAMP; }
      else if (room.status !== "finished") { room.status = "playing"; }
      return room;
    },
    (error, committed, snap) => {
      if (!error && !committed) {
        // Someone else moved first: reload their position, my move is void.
        const room = snap.val();
        if (room) {
          game.reset();
          (room.moves || []).forEach((m) => game.move(m));
          selected = null;
          setOnlineStatus("Opponent moved first — your move was not played, try again.");
          render();
        }
      }
    }
  );
}

// Write a finished result directly. Used when the opponent disconnected and
// flagged on my clock: pushMove's "only the side to move may write" check
// would abort since it's not my turn.
function declareResult(winner) {
  if (mode !== "online" || !roomRef) return;
  if (roomStatus === "finished") return;  // already recorded — don't rewrite
  roomStatus = "finished";               // lock locally before the async write
  const res = winner === "w" ? "1-0" : "0-1";
  roomRef.update({
    status: "finished",
    result: res,
    finishedAt: firebase.database.ServerValue.TIMESTAMP,
    clocks: { w: Math.max(0, Math.round(clockMs.w)), b: Math.max(0, Math.round(clockMs.b)) },
  }).catch(() => {});
}

function updatePresenceUI(room) {
  const p = room.players || {};
  const opp = myColor === "w" ? "b" : "w";
  const me = myColor === "w" ? "White" : "Black";
  const oppName = opp === "w" ? "White" : "Black";
  if (roomStatus === "finished") {
    const spec = myColor ? "" : "Spectating — ";
    setOnlineStatus(spec + 'Room "' + roomCode + '" — game over. ' + (gameOver ? gameOver.text : ""));
    return;
  }
  if (roomStatus === "waiting") {
    setOnlineStatus('Room "' + roomCode + '" — you are ' + me + ". Waiting for opponent…");
  } else if (!p[opp]) {
    setOnlineStatus("Opponent (" + oppName + ") disconnected. Waiting…");
  } else {
    setOnlineStatus(
      'Room "' + roomCode + '" — you are ' + me + ". " +
      (game.turn() === myColor ? "Your move!" : "Opponent to move…")
    );
  }
}

function onRoomUpdate(snap) {
  const room = snap.val();
  if (!room) { setOnlineStatus("Room was closed."); return; }
  roomStatus = room.status || "waiting";
  if (myColor) {
    const o = myColor === "w" ? "b" : "w";
    oppOnline = !!(room.players && room.players[o]);
  }
  // Adopt the OPPONENT's clock (mine is authoritative locally).
  if (room.clocks && myColor) {
    const opp = myColor === "w" ? "b" : "w";
    if (typeof room.clocks[opp] === "number") clockMs[opp] = room.clocks[opp];
  }
  // Adopt new moves (my own writes echo back harmlessly).
  const rm = Array.isArray(room.moves) ? room.moves : [];
  const lh = game.history();
  if (rm.length > lh.length) {
    for (let i = lh.length; i < rm.length; i++) {
      if (!game.move(rm[i])) break;
    }
    selected = null;
    updateGameOver();
  }
  if (room.status === "finished" && room.result && !gameOver) {
    gameOver = {
      winner: room.result === "1-0" ? "w" : room.result === "0-1" ? "b" : null,
      reason: "remote",
      text: resultLongText(room.result),
    };
  }
  updatePresenceUI(room);
  render();
}

async function joinRoom() {
  if (!initFirebaseOnce()) {
    setOnlineStatus("Online play is not configured yet — add your Firebase config (see README).");
    return;
  }
  const code = roomCodeInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
  if (!code) { setOnlineStatus("Enter a room code first."); return; }
  const ref = db.ref("rooms/" + code);
  let snap;
  try {
    snap = await ref.get();
  } catch (err) {
    setOnlineStatus("Could not reach the database: " + err.message);
    return;
  }
  const tcMin = parseInt(timeControl.value, 10) || 10;
  // Start from a fresh board for online play.
  game.reset(); selected = null; gameOver = null; hidePromoModal();
  let room = snap.exists() ? snap.val() : null;
  // Finished games are kept for 24h so both sides can see the result; then
  // the room data is deleted and the code becomes reusable for a new game.
  if (room && room.status === "finished" && typeof room.finishedAt === "number" &&
      Date.now() - room.finishedAt > 24 * 3600 * 1000) {
    try { await ref.remove(); } catch (e) { /* already gone */ }
    room = null;
  }
  const finished = !!room && room.status === "finished";
  if (!room) {
    // I create the room -> I am White.
    myColor = "w";
    clockMs = { w: tcMin * 60000, b: tcMin * 60000 };
    await ref.set({
      tc: tcMin,
      fen: game.fen(),
      turn: "w",
      moves: [],
      clocks: { w: clockMs.w, b: clockMs.b },
      players: { w: true },
      status: "waiting",
      result: null,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });
  } else {
    // Room exists. Finished games are view-only: join as a spectator
    // (myColor = null) so we never claim a player slot or reopen the game.
    if (!finished && room.players && room.players.b) {
      setOnlineStatus("Room is full — try another code.");
      return;
    }
    myColor = finished ? null : "b";
    (room.moves || []).forEach((m) => game.move(m));
    if (room.clocks) clockMs = { w: room.clocks.w, b: room.clocks.b };
    if (room.tc) timeControl.value = String(room.tc);
    if (!finished) {
      await ref.update({ "players/b": true, status: "playing" });
    }
  }
  roomRef = ref;
  roomCode = code;
  mode = "online";
  roomStatus = finished ? "finished" : (myColor === "w" ? "waiting" : "playing");
  if (myColor) ref.child("players/" + myColor).onDisconnect().remove();
  ref.on("value", onRoomUpdate);
  joinUI(true);
  onRoomUpdate(await ref.get());
}

async function leaveRoom() {
  if (roomRef) {
    roomRef.off();
    if (myColor) { try { await roomRef.child("players/" + myColor).remove(); } catch (e) { /* ignore */ } }
  }
  roomRef = null; myColor = null; mode = "local";
  oppOnline = false;
  roomStatus = "waiting"; roomCode = "";
  game.reset(); selected = null; gameOver = null; hidePromoModal();
  resetClocks();
  joinUI(false);
  setOnlineStatus("");
  render();
}

// ---------- game flow ----------
const GLYPH = {
  w: { k: "♚\uFE0E", q: "♛\uFE0E", r: "♜\uFE0E", b: "♝\uFE0E", n: "♞\uFE0E", p: "♟\uFE0E" },
  b: { k: "♚\uFE0E", q: "♛\uFE0E", r: "♜\uFE0E", b: "♝\uFE0E", n: "♞\uFE0E", p: "♟\uFE0E" },
};
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9 };   // piece values, for the captured tally

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const movesEl = document.getElementById("moves");
const capturedEl = document.getElementById("captured");
const timeControl = document.getElementById("timeControl");
const newGameBtn = document.getElementById("newGame");
const roomCodeInput = document.getElementById("roomCode");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const onlineStatusEl = document.getElementById("onlineStatus");
const promoModal = document.getElementById("promoModal");
const promoChoices = document.getElementById("promoChoices");

// (query clock spans after DOM is ready)
const clockWSpan = document.querySelector("#clockW span");
const clockBSpan = document.querySelector("#clockB span");
const clockWBox = document.getElementById("clockW");
const clockBBox = document.getElementById("clockB");

function updateGameOver() {
  if (gameOver) return;
  if (game.in_checkmate()) {
    const w = game.turn() === "w" ? "b" : "w";
    gameOver = {
      winner: w, reason: "checkmate",
      text: "Checkmate! 🎉 " + (w === "w" ? "White" : "Black") + " wins",
    };
  } else if (game.in_stalemate()) {
    gameOver = { winner: null, reason: "stalemate", text: "Stalemate 🤝 Draw" };
  } else if (game.in_draw()) {
    gameOver = {
      winner: null, reason: "draw",
      text: "Draw 🤝 (threefold repetition / fifty-move rule / insufficient material)",
    };
  }
}

function doMove(from, to, promotion) {
  const mv = game.move({ from, to, promotion });
  if (!mv) return;
  selected = null;
  updateGameOver();
  if (mode === "online") pushMove();
  render();
}

// Display coords (row, col) -> square name ("e4").
// Normal view: display (0,0) = a8; flipped: display (0,0) = h1 (black at bottom)
function sqName(row, col) {
  const br = flipped ? 7 - row : row;   // true board row
  const bc = flipped ? 7 - col : col;   // true board column
  return "abcdefgh"[bc] + (8 - br);
}

function render() {
  const position = game.board();          // 8x8 array, row 0 = 8th rank
  const last = game.history({ verbose: true }).slice(-1)[0];
  const hints = selected
    ? game.moves({ square: selected, verbose: true })
    : [];

  boardEl.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const br = flipped ? 7 - r : r;   // true board row
      const bc = flipped ? 7 - c : c;   // true board column
      const sq = sqName(r, c);
      const piece = position[br][bc];
      const div = document.createElement("div");
      div.className = "sq " + ((br + bc) % 2 === 0 ? "light" : "dark");
      div.dataset.square = sq;
      if (piece) {
        const span = document.createElement("span");
        span.className = "piece " + piece.color;
        span.textContent = GLYPH[piece.color][piece.type];
        div.appendChild(span);
      }
      if (sq === selected) div.classList.add("selected");
      if (last && (sq === last.from || sq === last.to)) div.classList.add("lastmove");
      const hint = hints.find((m) => m.to === sq);
      if (hint) {
        div.classList.add("hint");
        // NOTE: classList.add("") throws, so never pass an empty token.
        if (hint.captured) div.classList.add("capture");
      }
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
  renderStatus();
  renderMoves();
  renderCaptured();
  renderClocks();
}

function onSquareClick(e) {
  if (gameOver) return;
  const sq = e.currentTarget.dataset.square;
  if (mode === "online") {
    if (roomStatus !== "playing") { setOnlineStatus("Waiting for opponent to join…"); return; }
    if (game.turn() !== myColor) return;   // not my turn: ignore quietly
  }
  if (selected) {
    const moves = game.moves({ square: selected, verbose: true });
    const mv = moves.find((m) => m.to === sq);
    if (mv) {
      if (mv.promotion) {
        // Pawn reached the last rank: let the player choose the piece.
        pendingPromo = { from: selected, to: sq };
        showPromoModal(game.turn());
        return;
      }
      doMove(selected, sq, "q");
      return;
    }
  }
  // Clicked own piece -> select (or reselect); otherwise -> deselect
  const piece = game.get(sq);
  selected = piece && piece.color === game.turn() ? sq : null;
  render();
}

function renderStatus() {
  if (gameOver) { statusEl.textContent = gameOver.text; return; }
  let text = (game.turn() === "w" ? "White" : "Black") + " to move";
  if (game.in_check()) text += " — check!";
  if (mode === "online" && myColor) {
    text += game.turn() === myColor ? " (you)" : " (opponent)";
  }
  statusEl.textContent = text;
}

function renderMoves() {
  const history = game.history();   // ["e4", "e5", "Nf3", ...]
  movesEl.innerHTML = "";
  for (let i = 0; i < history.length; i += 2) {
    const li = document.createElement("li");
    li.textContent = history[i] + (history[i + 1] ? "  " + history[i + 1] : "");
    movesEl.appendChild(li);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

function renderCaptured() {
  // Captured pieces: starting material minus pieces left on the board
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const onBoard = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 },
                    b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
  for (const row of game.board())
    for (const piece of row)
      if (piece && piece.type !== "k") onBoard[piece.color][piece.type]++;

  let html = "";
  let scoreW = 0, scoreB = 0;
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.b[type]; i++) {  // black pieces captured by White
      html += '<span class="piece b">' + GLYPH.b[type] + "</span>";
      scoreW += VALUE[type];
    }
  }
  html += " ";
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.w[type]; i++) {  // white pieces captured by Black
      html += '<span class="piece w">' + GLYPH.w[type] + "</span>";
      scoreB += VALUE[type];
    }
  }
  const diff = scoreW - scoreB;
  if (diff !== 0)
    html += '<span class="score">' + (diff > 0 ? "White +" : "Black +")
      + Math.abs(diff) + "</span>";
  capturedEl.innerHTML = html;
}

// ---------- promotion picker ----------
function showPromoModal(color) {
  promoChoices.innerHTML = "";
  for (const p of ["q", "r", "b", "n"]) {
    const b = document.createElement("button");
    b.className = "promo-btn piece " + color;
    b.textContent = GLYPH[color][p];
    b.addEventListener("click", () => {
      const pp = pendingPromo;
      pendingPromo = null;
      hidePromoModal();
      if (pp) doMove(pp.from, pp.to, p);
    });
    promoChoices.appendChild(b);
  }
  promoModal.classList.remove("hidden");
}

function hidePromoModal() {
  promoModal.classList.add("hidden");
  promoChoices.innerHTML = "";
}

promoModal.addEventListener("click", (e) => {
  if (e.target === promoModal) {   // click outside the box: cancel
    pendingPromo = null;
    hidePromoModal();
    selected = null;
    render();
  }
});

// ---------- buttons ----------
newGameBtn.addEventListener("click", () => {
  if (mode === "online") return;
  game.reset();
  selected = null;
  gameOver = null;
  hidePromoModal();
  resetClocks();
  render();
});

document.getElementById("flipBoard").addEventListener("click", () => {
  flipped = !flipped;
  render();
});

timeControl.addEventListener("change", () => {
  if (mode === "online") return;
  resetClocks();
  renderClocks();
});

joinBtn.addEventListener("click", joinRoom);
roomCodeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinRoom(); });
leaveBtn.addEventListener("click", leaveRoom);

// ---------- init ----------
resetClocks();
render();
</script>
</body>
</html>
