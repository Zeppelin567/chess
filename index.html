<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess ♞ Two-Player Game</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #161512; color: #bababa; margin: 0; padding: 24px;
         display: flex; flex-direction: column; align-items: center; }
  h1 { color: #fff; font-size: 22px; margin: 0 0 16px; }
  h1 small { color: #888; font-weight: normal; font-size: 14px; }
  #app { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
         justify-content: center; }
  #board { display: grid; grid-template-columns: repeat(8, 64px);
           grid-template-rows: repeat(8, 64px); border-radius: 6px;
           overflow: hidden; user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center;
        font-size: 44px; cursor: pointer; position: relative; }
  .light { background: #f0d9b5; }
  .dark { background: #b58863; }
  .sq.selected { outline: 3px solid #829769; outline-offset: -3px; }
  .sq.lastmove { background: #cdd26a; }
  .sq.lastmove.dark { background: #aaa23a; }
  /* dots marking legal moves */
  .sq.hint::after { content: ""; width: 20px; height: 20px; border-radius: 50%;
                    background: rgba(20, 85, 30, 0.35); position: absolute; }
  .sq.hint.capture::after { width: 56px; height: 56px; background: transparent;
                    border: 5px solid rgba(20, 85, 30, 0.35); }
  .piece.w { color: #fff; text-shadow: 0 0 3px #000, 0 2px 2px #000; }
  .piece.b { color: #000; text-shadow: 0 0 3px #fff, 0 1px 1px #555; }
  #side { width: 260px; display: flex; flex-direction: column; gap: 12px; }
  #status { background: #262421; border-radius: 6px; padding: 12px;
            font-size: 15px; color: #fff; min-height: 20px; }
  #captured { font-size: 26px; min-height: 32px; line-height: 1.2; }
  #captured .score { font-size: 14px; color: #888; margin-left: 8px; }
  #moves { background: #262421; border-radius: 6px; padding: 12px 12px 12px 32px;
           margin: 0; height: 220px; overflow-y: auto; font-size: 14px; }
  #moves li { margin-bottom: 2px; }
  button { background: #629924; color: #fff; border: none; border-radius: 6px;
           padding: 10px; font-size: 15px; cursor: pointer; }
  button:hover { background: #7cb342; }
  .note { font-size: 12px; color: #666; max-width: 560px; text-align: center;
          margin-top: 16px; }
</style>
</head>
<body>
<h1>♞ Chess <small>two-player game</small></h1>
<div id="app">
  <div id="board"></div>
  <div id="side">
    <div id="status">White to move</div>
    <div id="captured"></div>
    <ol id="moves"></ol>
    <button id="newGame">New game</button>
    <button id="flipBoard">Flip board</button>
  </div>
</div>
<p class="note">Click a piece to select it (green dots mark legal moves), then click a target square. Promotion auto-queens.<br>
Rules engine: chess.js (check / checkmate / stalemate / draw detection)</p>

<!-- chess.js handles all the rules: legal moves, check, checkmate, stalemate, castling, en passant.
     NOTE: chess.js 0.13.4 ships as an ES module, so it must be imported from a
     type="module" script -- a classic <script src> would throw a SyntaxError
     on the `export` statement and kill the whole game. -->
<script type="module">
import { Chess } from "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js";

const game = new Chess();   // chess.js owns all game state
let selected = null;        // currently selected square, e.g. "e2"
let flipped = false;        // flip the board (black at the bottom)

const GLYPH = {
  w: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" },
  b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" },
};
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9 };   // piece values, for the captured tally

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const movesEl = document.getElementById("moves");
const capturedEl = document.getElementById("captured");

// Display coords (row, col) -> square name ("e4").
// Normal view: display (0,0) = a8; flipped: display (0,0) = h1 (black at bottom)
function sqName(row, col) {
  const br = flipped ? 7 - row : row;   // true board row
  const bc = flipped ? 7 - col : col;   // true board column
  return "abcdefgh"[bc] + (8 - br);
}

function render() {
  const position = game.board();          // 8x8 array, row 0 = 8th rank
  const last = game.history({ verbose: true }).slice(-1)[0];
  const hints = selected
    ? game.moves({ square: selected, verbose: true })
    : [];

  boardEl.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const br = flipped ? 7 - r : r;   // true board row
      const bc = flipped ? 7 - c : c;   // true board column
      const sq = sqName(r, c);
      const piece = position[br][bc];
      const div = document.createElement("div");
      div.className = "sq " + ((br + bc) % 2 === 0 ? "light" : "dark");
      div.dataset.square = sq;
      if (piece) {
        const span = document.createElement("span");
        span.className = "piece " + piece.color;
        span.textContent = GLYPH[piece.color][piece.type];
        div.appendChild(span);
      }
      if (sq === selected) div.classList.add("selected");
      if (last && (sq === last.from || sq === last.to)) div.classList.add("lastmove");
      const hint = hints.find((m) => m.to === sq);
      if (hint) div.classList.add("hint", hint.captured ? "capture" : "");
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
  renderStatus();
  renderMoves();
  renderCaptured();
}

function onSquareClick(e) {
  const sq = e.currentTarget.dataset.square;
  // Case 1: a piece is selected and the clicked square is a legal target -> move
  if (selected) {
    const move = game.moves({ square: selected, verbose: true })
      .find((m) => m.to === sq);
    if (move) {
      game.move({ from: selected, to: sq, promotion: "q" });  // auto-queen on promotion
      selected = null;
      render();
      return;
    }
  }
  // Case 2: clicked own piece -> select (or reselect); otherwise -> deselect
  const piece = game.get(sq);
  selected = piece && piece.color === game.turn() ? sq : null;
  render();
}

function renderStatus() {
  let text;
  if (game.in_checkmate()) {
    const winner = game.turn() === "w" ? "Black" : "White";
    text = "Checkmate! 🎉 " + winner + " wins";
  } else if (game.in_stalemate()) {
    text = "Stalemate 🤝 Draw";
  } else if (game.in_draw()) {
    text = "Draw 🤝 (threefold repetition / fifty-move rule / insufficient material)";
  } else {
    text = (game.turn() === "w" ? "White" : "Black") + " to move";
    if (game.in_check()) text += " — check!";
  }
  statusEl.textContent = text;
}

function renderMoves() {
  const history = game.history();   // ["e4", "e5", "Nf3", ...]
  movesEl.innerHTML = "";
  for (let i = 0; i < history.length; i += 2) {
    const li = document.createElement("li");
    li.textContent = history[i] + (history[i + 1] ? "  " + history[i + 1] : "");
    movesEl.appendChild(li);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

function renderCaptured() {
  // Captured pieces: starting material minus pieces left on the board
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const onBoard = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 },
                    b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
  for (const row of game.board())
    for (const piece of row)
      if (piece && piece.type !== "k") onBoard[piece.color][piece.type]++;

  let html = "";
  let scoreW = 0, scoreB = 0;
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.b[type]; i++) {  // black pieces captured by White
      html += '<span class="piece b">' + GLYPH.b[type] + "</span>";
      scoreW += VALUE[type];
    }
  }
  html += " ";
  for (const type of ["q", "r", "b", "n", "p"]) {
    for (let i = 0; i < start[type] - onBoard.w[type]; i++) {  // white pieces captured by Black
      html += '<span class="piece w">' + GLYPH.w[type] + "</span>";
      scoreB += VALUE[type];
    }
  }
  const diff = scoreW - scoreB;
  if (diff !== 0)
    html += '<span class="score">' + (diff > 0 ? "White +" : "Black +")
      + Math.abs(diff) + "</span>";
  capturedEl.innerHTML = html;
}

document.getElementById("newGame").addEventListener("click", () => {
  game.reset();
  selected = null;
  render();
});

document.getElementById("flipBoard").addEventListener("click", () => {
  flipped = !flipped;
  render();
});

render();
</script>
</body>
</html>
